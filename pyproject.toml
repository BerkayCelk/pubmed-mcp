[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmed-mcp"
version = "1.0.1"
description = "MCP server for biomedical literature research: PubMed, Europe PMC, full text, MeSH, citations, clinical trials, Semantic Scholar, OpenFDA and DrugBank"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Berkay Çelik" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "pubmed",
    "biomedical",
    "literature",
    "mesh",
    "openfda",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/BerkayCelk/pubmed-mcp"
"Bug Tracker" = "https://github.com/BerkayCelk/pubmed-mcp/issues"
"Data: PubMed" = "https://pubmed.ncbi.nlm.nih.gov"

[project.scripts]
pubmed-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
