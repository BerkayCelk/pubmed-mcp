# Hermes Agent (https://github.com/NousResearch/hermes-agent) example snippet.
# Add under your config.yaml's `mcp_servers` section, then reload MCP.
mcp_servers:
  pubmed:
    command: uvx
    args:
      - --from
      - git+https://github.com/BerkayCelk/pubmed-mcp
      - pubmed-mcp
    timeout: 90
    enabled: true
